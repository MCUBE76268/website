<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Offline</title>
    <meta name="robots" content="noindex,follow">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 20px;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #bbc1c7;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 10px;
        }
        p {
            font-size: 14px;
            color: #5f6368;
            line-height: 1.5;
        }
        button {
            margin-top: 25px;
            padding: 10px 24px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background-color: #1765cc;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">⚠</div>
    <h1>Page down...</h1>
    <p>Try checking the network cables, modem, and router or administration</p>
    <p><strong>PAGE_FAULT_IN_NON_PAGED_AREA (0x50)</strong></p>
    <button onclick="retry()">Reload</button>
</div>

<script>
    function retry() {
        // Simulates a reload attempt to "resave" the current state
        location.reload();
    }
</script>

</body>
</html>
